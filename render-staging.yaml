# Render Blueprint — staging copy of the FastAPI backend, deployed from the
# `staging` branch against a separate (Neon branch) database.
#
# Usage:
#   1. In Neon, create a database branch (e.g. "staging") off your main
#      project — this gives you an isolated copy of the schema/data to test
#      against without touching production data.
#   2. In Render: New > Blueprint > select this repo > set "Branch" to
#      `staging` so it tracks the staging branch instead of master.
#   3. Fill in DATABASE_URL (the Neon staging branch connection string) and
#      ALLOWED_ORIGINS (your Vercel staging/preview URL) when prompted.
#   4. SECRET_KEY is auto-generated by Render (separate from production).

services:
  - type: web
    name: rfq-dashboard-backend-staging
    runtime: docker
    plan: free
    branch: staging
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: ALLOWED_ORIGINS
        sync: false

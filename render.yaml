# Render Blueprint — deploys the FastAPI backend as a free web service.
#
# Usage:
#   1. Create a free Postgres database at https://neon.tech and copy its
#      connection string (convert "postgresql://" to "postgresql+asyncpg://").
#   2. In Render: New > Blueprint > select this repo.
#   3. Fill in the DATABASE_URL and ALLOWED_ORIGINS env vars when prompted
#      (ALLOWED_ORIGINS = your Vercel/Netlify frontend URL).
#   4. SECRET_KEY is auto-generated by Render.

services:
  - type: web
    name: rfq-dashboard-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: ALLOWED_ORIGINS
        sync: false
